name: release-skills

# Publishing from a plain tag push is disabled by default. It only happens once
# the repository variable ENABLE_AUTO_RELEASE is set to "true"
# (Settings -> Secrets and variables -> Actions -> Variables).
# Manual runs and calls from auto-tag always work. Manual runs default to a dry
# run that builds and uploads the archives without creating a GitHub Release.

on:
  push:
    tags:
      - '*--v*'
  workflow_call:
    inputs:
      tag:
        description: Tag to release, in the form <plugin>--v<version>
        required: true
        type: string
      dry_run:
        description: Build the archives but do not publish a GitHub Release
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, in the form <plugin>--v<version>
        required: true
        type: string
      dry_run:
        description: Build the archives but do not publish a GitHub Release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    # An explicit dispatch or a call from auto-tag is always allowed. A bare tag
    # push waits for the opt-in variable, so a stray tag cannot publish.
    if: github.event_name != 'push' || vars.ENABLE_AUTO_RELEASE == 'true'
    env:
      DRY_RUN: ${{ inputs.dry_run || 'false' }}
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_TAG}"
          if [ -z "$tag" ]; then
            echo "No tag supplied and this run was not triggered by a tag" >&2
            exit 1
          fi
          # Split on the `--v` separator so plugin names may contain hyphens.
          case "$tag" in
            *--v*) ;;
            *) echo "Tag '$tag' is not in the form <plugin>--v<version>" >&2; exit 1 ;;
          esac
          name="${tag%%--v*}"
          version="${tag##*--v}"
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing plugin '$name' version '$version'"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the tagged commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout --detach "refs/tags/${TAG}"
            echo "Building from tag ${TAG}"
          elif [ "$DRY_RUN" = "true" ]; then
            # Lets a dry run rehearse the whole build before any tag exists.
            echo "::warning::Tag ${TAG} does not exist. Dry run continues on $(git rev-parse --abbrev-ref HEAD)."
          else
            echo "Tag ${TAG} does not exist" >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate the tagged tree
        run: python3 scripts/validate_marketplace.py

      - name: Check the tag matches the manifest version
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(python3 -c "
          import json, pathlib, sys
          m = json.loads(pathlib.Path('plugins/$NAME/.claude-plugin/plugin.json').read_text())
          print(m['version'])
          ")
          if [ "$actual" != "$VERSION" ]; then
            echo "Tag says $VERSION but plugins/$NAME/.claude-plugin/plugin.json says $actual" >&2
            exit 1
          fi

      - name: Build release archives
        id: build
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist

          # The whole plugin, for anyone vendoring it outside the marketplace.
          ( cd plugins && zip -qr "../dist/${NAME}--v${VERSION}.zip" "$NAME" -x '*.DS_Store' )

          # One archive per skill. Each unzips to a single folder holding
          # SKILL.md, which is the layout claude.ai expects for a skill upload.
          skills_dir="plugins/${NAME}/skills"
          if [ -d "$skills_dir" ]; then
            for skill in "$skills_dir"/*/; do
              [ -f "${skill}SKILL.md" ] || continue
              slug=$(basename "$skill")
              ( cd "$skills_dir" && zip -qr "$GITHUB_WORKSPACE/dist/${NAME}-${slug}-skill--v${VERSION}.zip" "$slug" -x '*.DS_Store' )
            done
          fi

          ls -lh dist
          ( cd dist && sha256sum ./*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Write release notes
        id: notes
        env:
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > dist/NOTES.md
          import json, os, pathlib

          name = os.environ["NAME"]
          version = os.environ["VERSION"]
          repo = os.environ["REPO"]
          root = pathlib.Path("plugins") / name

          manifest = json.loads((root / ".claude-plugin" / "plugin.json").read_text())
          print(f"## {manifest.get('displayName') or name} {version}\n")
          print(manifest.get("description", "") + "\n")

          skills = sorted(p for p in (root / "skills").glob("*/SKILL.md")) if (root / "skills").is_dir() else []
          if skills:
              print("### Skills in this release\n")
              for skill_md in skills:
                  slug = skill_md.parent.name
                  description = ""
                  text = skill_md.read_text(encoding="utf-8")
                  if text.startswith("---\n"):
                      end = text.find("\n---", 3)
                      for line in text[4:end].splitlines():
                          if line.startswith("description:"):
                              description = line.partition(":")[2].strip().strip("'\"")
                  print(f"- **{slug}** {description}" if description else f"- **{slug}**")
              print()

          print("### Install\n")
          print("```")
          print(f"/plugin marketplace add {repo}")
          print(f"/plugin install {name}@agent-marketplace")
          print("```")
          PY
          cat dist/NOTES.md

      - name: Publish the release
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, replacing its assets"
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file dist/NOTES.md
          else
            gh release create "$TAG" dist/*.zip dist/SHA256SUMS.txt \
              --title "$NAME $VERSION" \
              --notes-file dist/NOTES.md
          fi

      - name: Dry run summary
        if: env.DRY_RUN == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          {
            echo "### release-skills (dry run)"
            echo "No GitHub Release was created for \`$TAG\`."
            echo "The archives below were built and attached to this run."
            echo
            echo '```'
            ls -1 dist
            echo '```'
            echo
            cat dist/NOTES.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on dry runs and real runs alike, so the archives can be
      # downloaded and inspected before anything is published.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.tag.outputs.tag }}
          path: dist/
          if-no-files-found: error
